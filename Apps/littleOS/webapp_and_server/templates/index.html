<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>littleOS Command Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background-color: #121212; color: #00ff00; font-family: monospace; margin: 0; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column;}
        h1 { border-bottom: 1px solid #00ff00; padding-bottom: 10px; margin-top: 0; flex-shrink: 0;}
        
        /* Layout Grid */
        .container { display: flex; gap: 20px; flex-grow: 1; overflow: hidden; }
        .col-left { display: flex; flex-direction: column; width: 35%; gap: 20px; }
        .col-right { width: 65%; display: flex; flex-direction: column; }
        
        /* Box Styling */
        .box { border: 1px solid #00ff00; padding: 15px; background: #0a0a0a; overflow-y: auto; display: flex; flex-direction: column;}
        h3 { margin-top: 0; border-bottom: 1px dashed #005500; padding-bottom: 5px; color: #00ff00; flex-shrink: 0;}
        
        /* Specific Box Sizes */
        .box-uptime { flex: 0 0 auto; }
        .box-esp { flex: 0 0 auto; }
        .box-terminal { flex: 1 1 auto; } /* Takes remaining space on the left */
        .box-table { flex: 1 1 auto; }    /* Takes full height on the right */

        /* Terminal specifics */
        #terminal-log { color: #aaa; overflow-y: auto; flex-grow: 1; padding-bottom: 10px;}
        .input-group { display: flex; flex-shrink: 0; border-top: 1px solid #005500; padding-top: 10px;}
        input[type="text"] { flex-grow: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; font-family: monospace; font-size: 14px; outline: none; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; font-family: monospace; }
        button:hover { background: #00cc00; }
        p { margin: 5px 0;}
    </style>
</head>
<body>

    <h1>[littleOS] Remote IoT Command Hub</h1>

    <div class="container">
        <div class="col-left">
            <div class="box box-uptime">
                <h3>>> System Status</h3>
                <div id="uptime-display">Awaiting telemetry...</div>
            </div>

            <div class="box box-esp">
                <h3>>> Wi-Fi Bridge [ESP8266]</h3>
                <div id="esp-status-display">Awaiting telemetry...</div>
            </div>

            <div class="box box-terminal">
                <h3>>> Terminal</h3>
                <div id="terminal-log"></div>
                
                <div class="input-group">
                    <span style="padding: 10px;">></span>
                    <input type="text" id="cmdInput" placeholder="Enter command (e.g. ledblink -n 5)..." autocomplete="off" onkeypress="handleEnter(event)">
                    <button onclick="sendCommand()">SEND</button>
                </div>
                <p style="font-size: 12px; color: #555; text-align: right;">* 'exec' is prepended automatically.</p>
            </div>
        </div>

        <div class="col-right">
            <div class="box box-table">
                <h3>>> Active Threads Dashboard</h3>
                <div id="threads-display" style="flex-grow: 1; overflow-y: auto;">Awaiting telemetry...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Listen for realtime 'status_update' broadcasts from Python
        socket.on('status_update', function(data) {
            document.getElementById('uptime-display').innerHTML = data.uptime;
            document.getElementById('esp-status-display').innerHTML = data.esp_status;
            document.getElementById('threads-display').innerHTML = data.threads;
        });

        function sendCommand() {
            const input = document.getElementById('cmdInput');
            const cmd = input.value;
            if (!cmd) return;

            const log = document.getElementById('terminal-log');
            log.innerHTML += `<div><span style="color:white">> ${cmd}</span></div>`;
            input.value = '';

            fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            })
            .then(res => res.json())
            .then(data => {
                if(data.error) {
                    log.innerHTML += `<div style="color:red">[!] Error: ${data.error}</div>`;
                } else {
                    log.innerHTML += `<div style="color:#00ff00">[+] Sent to NXP successfully.</div>`;
                }
                log.scrollTop = log.scrollHeight; // Auto-scroll to bottom
            });
        }

        function handleEnter(e) { if(e.key === 'Enter') sendCommand(); }
    </script>
</body>
</html>
